name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve bump from labels
        id: bump
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, '\n') }}
        run: |
          bump=patch
          if printf '%s\n' "$LABELS" | grep -Fxq 'release:major'; then
            bump=major
          elif printf '%s\n' "$LABELS" | grep -Fxq 'release:minor'; then
            bump=minor
          elif printf '%s\n' "$LABELS" | grep -Fxq 'release:patch'; then
            bump=patch
          fi
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "Resolved bump: $bump"

      - name: Guard against existing next tag
        env:
          BUMP: ${{ steps.bump.outputs.bump }}
        run: |
          git fetch --tags --force
          next="$(node -e "
            const bump = process.env.BUMP;
            let [major, minor, patch] = require('./package.json').version.split('.').map(Number);
            if (bump === 'major') { major += 1; minor = 0; patch = 0; }
            else if (bump === 'minor') { minor += 1; patch = 0; }
            else { patch += 1; }
            process.stdout.write(\`\${major}.\${minor}.\${patch}\`);
          ")"
          if git rev-parse "refs/tags/v${next}" >/dev/null 2>&1; then
            echo "Tag v${next} already exists; refusing to bump again."
            exit 1
          fi
          echo "Next version will be v${next}"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        run: pnpm "version:${{ steps.bump.outputs.bump }}"

      - name: Push version commit and tag
        id: push
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          git push origin "HEAD:main"
          git push origin "v${version}"

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.push.outputs.version }}
          draft: true
          generate_release_notes: true
          files: dist/*.user.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
